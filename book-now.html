<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSlot | Book Appointment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="nav-logo" href="index.html#home">
      <div class="nav-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <span class="nav-logo-text">MediSlot</span>
    </a>
    <div class="nav-links">
      <a class="nav-link active" href="index.html#home">Find Doctors</a>
      <a class="nav-link" href="appointments.html">My Appointments</a>
      <a class="btn btn-primary" style="margin-left:8px;text-decoration:none" href="book-now.html">Book Now</a>
    </div>
    <button class="hamburger" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a class="mobile-link" href="index.html#home">Find Doctors</a>
    <a class="mobile-link" href="appointments.html">My Appointments</a>
  </div>
</nav>
<div class="screen" id="booking">
  <div class="booking">
    <div class="breadcrumb">
      <a href="index.html#profile" id="bkBc">Dr. Priya Sharma</a>
      <span>â€º</span><span style="color:var(--s600)">Book Slot</span>
    </div>
    <div class="card doc-strip">
      <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=200&amp;h=200&amp;fit=crop&amp;auto=format" alt="Dr. Priya Sharma" class="strip-avatar" />
      <div>
        <div class="strip-name" id="bkDocName">Dr. Priya Sharma</div>
        <div class="strip-sub" id="bkDocSub">Cardiology &middot; &#8377;800</div>
      </div>
    </div>
    <div class="booking-grid">
      <!-- Calendar -->
      <div class="card cal">
        <div class="cal-nav">
          <button class="cal-btn">â€¹</button>
          <span class="cal-month" id="calLabel">September 2026</span>
          <button class="cal-btn">â€º</button>
        </div>
        <div class="cal-weekdays">
          <div class="cal-wd">Su</div><div class="cal-wd">Mo</div><div class="cal-wd">Tu</div>
          <div class="cal-wd">We</div><div class="cal-wd">Th</div><div class="cal-wd">Fr</div><div class="cal-wd">Sa</div>
        </div>
        <div class="cal-days"><div></div><div></div><button class="cal-day" type="button">1</button><button class="cal-day" type="button">2</button><button class="cal-day" type="button">3</button><button class="cal-day" type="button">4</button><button class="cal-day" type="button">5</button><button class="cal-day" type="button">6</button><button class="cal-day" type="button">7</button><button class="cal-day" type="button">8</button><button class="cal-day" type="button">9</button><button class="cal-day" type="button">10</button><button class="cal-day" type="button">11</button><button class="cal-day" type="button">12</button><button class="cal-day" type="button">13</button><button class="cal-day" type="button">14</button><button class="cal-day" type="button">15</button><button class="cal-day" type="button">16</button><button class="cal-day" type="button">17</button><button class="cal-day" type="button">18</button><button class="cal-day" type="button">19</button><button class="cal-day" type="button">20</button><button class="cal-day" type="button">21</button><button class="cal-day" type="button">22</button><button class="cal-day" type="button">23</button><button class="cal-day" type="button">24</button><button class="cal-day selected" type="button">25</button><button class="cal-day" type="button">26</button><button class="cal-day" type="button">27</button><button class="cal-day" type="button">28</button><button class="cal-day" type="button">29</button><button class="cal-day" type="button">30</button></div>
      </div>
      <!-- Slots + Form -->
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="card slots">
          <div class="slots-title">Available Slots &ndash; September 25</div><div class="slots-grid"><button class="slot" type="button">9:00 AM</button><button class="slot" type="button">10:00 AM</button><button class="slot unavail" type="button" disabled>11:00 AM</button><button class="slot" type="button">12:00 PM</button><button class="slot unavail" type="button" disabled>2:00 PM</button><button class="slot" type="button">3:00 PM</button><button class="slot" type="button">4:00 PM</button><button class="slot" type="button">5:00 PM</button></div>
        </div>
        <div class="card patient-form">
          <h3>Patient Details</h3>
          <div style="display:flex;gap:8px;margin-bottom:16px">
            <span class="consult-type">&#127973; In-person</span>
            <span class="consult-type">&#128249; Video</span>
          </div>
          <div class="form-field">
            <label class="form-label">Full Name</label>
            <input class="form-input" id="patName" type="text" placeholder="e.g. Rahul Verma" />
          </div>
          <div class="form-field">
            <label class="form-label">Phone Number</label>
            <input class="form-input" id="patPhone" type="tel" placeholder="+91 98765 43210" />
          </div>
          <div class="form-field">
            <label class="form-label">Reason for Visit (optional)</label>
            <textarea class="form-textarea" id="patReason" placeholder="Brief descriptionâ€¦"></textarea>
          </div>
          <button class="btn btn-primary btn-lg" style="width:100%;opacity:.45;cursor:not-allowed" disabled>Fill in Details to Book</button>
        </div>
      </div>
    </div>
  </div>
</div>


</body>
</html>
